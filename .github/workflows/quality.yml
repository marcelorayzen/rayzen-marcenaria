name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --check HEAD~1 HEAD
      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked_environment_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_environment_files" ]; then
            echo "Environment files must not be tracked. Keep only .env.example."
            echo "$tracked_environment_files"
            exit 1
          fi
